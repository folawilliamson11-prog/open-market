<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="OpenMarket e-commerce UX case study by Senior UI/UX Designer Adebayo Olaniyi."
  >

  <title>OpenMarket Case Study | Adebayo Olaniyi</title>

  <style>
    :root {
      --deep-blue: #123e57;
      --blue: #086f78;
      --teal: #007c76;
      --light-teal: #e1f7f4;
      --pale-teal: #f2fbfa;
      --yellow: #ffd166;
      --yellow-hover: #ffe39a;
      --white: #ffffff;
      --heading: #12324a;
      --text: #354f5f;
      --muted: #526a78;
      --border: #cbdde2;
      --cream: #fff9eb;
      --shadow: 0 18px 45px rgba(18, 62, 87, 0.14);
      --radius: 24px;
      --maximum-width: 1160px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--white);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 17px;
      line-height: 1.7;
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
    }

    .container {
      width: min(90%, var(--maximum-width));
      margin: 0 auto;
    }

    .skip-link {
      position: absolute;
      top: -100px;
      left: 20px;
      z-index: 1000;
      background: var(--yellow);
      color: var(--heading);
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: 800;
    }

    .skip-link:focus {
      top: 20px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.97);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .navigation {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .brand {
      color: var(--heading);
      font-size: 1.05rem;
      font-weight: 900;
      text-decoration: none;
    }

    .brand:hover,
    .brand:focus {
      color: var(--teal);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      list-style: none;
    }

    .nav-links a {
      color: var(--heading);
      font-size: 0.94rem;
      font-weight: 800;
      text-decoration: none;
    }

    .nav-links a:hover,
    .nav-links a:focus {
      color: var(--teal);
    }

    .menu-button {
      display: none;
      background: var(--deep-blue);
      color: var(--white);
      border: 0;
      border-radius: 10px;
      padding: 10px 15px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
    }

    .hero {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 82% 18%,
          rgba(159, 246, 233, 0.2),
          transparent 29%
        ),
        linear-gradient(
          135deg,
          var(--deep-blue) 0%,
          var(--blue) 100%
        );
      color: var(--white);
      padding: 100px 0 85px;
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -100px;
      bottom: -170px;
      width: 450px;
      height: 450px;
      border: 70px solid rgba(255, 255, 255, 0.06);
      border-radius: 50%;
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      color: var(--teal);
      font-size: 0.8rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .hero .eyebrow {
      color: #9ff6e9;
    }

    h1 {
      max-width: 850px;
      margin: 16px 0 24px;
      color: var(--white);
      font-size: clamp(3.6rem, 10vw, 7rem);
      line-height: 0.96;
      letter-spacing: -0.06em;
    }

    .hero-intro {
      max-width: 790px;
      color: var(--white);
      font-size: 1.18rem;
      font-weight: 500;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 32px;
    }

    .button {
      display: inline-block;
      border: 2px solid transparent;
      border-radius: 999px;
      padding: 12px 23px;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      transition: 0.2s ease;
    }

    .button:hover,
    .button:focus {
      transform: translateY(-2px);
    }

    .button-primary {
      background: var(--yellow);
      color: var(--heading);
    }

    .button-primary:hover,
    .button-primary:focus {
      background: var(--yellow-hover);
    }

    .button-secondary {
      background: var(--white);
      border-color: var(--white);
      color: var(--deep-blue);
    }

    .button-secondary:hover,
    .button-secondary:focus {
      background: var(--light-teal);
      color: var(--teal);
    }

    .project-meta {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-top: 48px;
      padding-top: 30px;
      border-top: 1px solid rgba(255, 255, 255, 0.45);
    }

    .meta-item span {
      display: block;
      margin-bottom: 5px;
      color: #9ff6e9;
      font-size: 0.73rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .meta-item strong {
      color: var(--white);
      font-size: 0.95rem;
    }

    section {
      padding: 88px 0;
    }

    .light-section {
      background: var(--white);
    }

    .alternate-section {
      background: var(--pale-teal);
    }

    .section-heading {
      max-width: 800px;
      margin-bottom: 42px;
    }

    .section-heading h2 {
      margin: 8px 0 16px;
      color: var(--heading);
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1.1;
      letter-spacing: -0.035em;
    }

    .section-heading p {
      color: var(--text);
      font-size: 1.05rem;
    }

    .two-column {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 45px;
      align-items: start;
    }

    .content-block h3 {
      margin-bottom: 12px;
      color: var(--heading);
      font-size: 1.35rem;
    }

    .content-block p {
      margin-bottom: 18px;
      color: var(--text);
    }

    .highlight {
      background: var(--light-teal);
      border-left: 5px solid var(--teal);
      border-radius: var(--radius);
      padding: 34px;
    }

    .highlight strong {
      display: block;
      margin-bottom: 12px;
      color: var(--heading);
      font-size: 1.25rem;
    }

    .highlight p {
      color: var(--text);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 30px;
      box-shadow: var(--shadow);
    }

    .card-number {
      margin-bottom: 22px;
      color: var(--teal);
      font-size: 0.85rem;
      font-weight: 900;
    }

    .card h3 {
      margin-bottom: 10px;
      color: var(--heading);
      font-size: 1.2rem;
    }

    .card p {
      color: var(--text);
    }

    .process {
      counter-reset: process;
    }

    .process-item {
      counter-increment: process;
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 25px;
      padding: 30px 0;
      border-bottom: 1px solid var(--border);
    }

    .process-item::before {
      content: "0" counter(process);
      color: var(--teal);
      font-size: 1.4rem;
      font-weight: 900;
    }

    .process-item h3 {
      margin-bottom: 8px;
      color: var(--heading);
      font-size: 1.3rem;
    }

    .process-item p {
      color: var(--text);
    }

    .bright-section {
      background:
        linear-gradient(
          135deg,
          var(--deep-blue) 0%,
          var(--blue) 100%
        );
      color: var(--white);
    }

    .bright-section .eyebrow {
      color: #9ff6e9;
    }

    .bright-section .section-heading h2,
    .bright-section .section-heading p {
      color: var(--white);
    }

    .persona-card {
      display: grid;
      grid-template-columns: 0.7fr 1.3fr;
      gap: 40px;
      background: rgba(255, 255, 255, 0.13);
      border: 2px solid rgba(255, 255, 255, 0.38);
      border-radius: 30px;
      padding: 40px;
    }

    .persona-summary {
      display: grid;
      place-items: center;
      min-height: 250px;
      background: var(--white);
      border-radius: 24px;
      padding: 30px;
      text-align: center;
    }

    .persona-summary h3 {
      color: var(--heading);
      font-size: 1.7rem;
    }

    .persona-summary p {
      color: var(--text);
    }

    .persona-details h3 {
      margin-bottom: 12px;
      color: var(--white);
      font-size: 1.4rem;
    }

    .persona-details p {
      margin-bottom: 20px;
      color: var(--white);
    }

    .persona-details ul {
      padding-left: 22px;
      color: var(--white);
    }

    .persona-details li {
      margin-bottom: 9px;
    }

    .flow {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }

    .flow-step {
      position: relative;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px 15px;
      color: var(--heading);
      font-weight: 800;
      text-align: center;
      box-shadow: 0 8px 22px rgba(18, 62, 87, 0.08);
    }

    .flow-step:not(:last-child)::after {
      content: "→";
      position: absolute;
      top: 50%;
      right: -18px;
      z-index: 2;
      color: var(--teal);
      font-size: 1.3rem;
      transform: translateY(-50%);
    }

    .design-board {
      background: var(--deep-blue);
      border-radius: 30px;
      padding: 25px;
      box-shadow: var(--shadow);
    }

    .design-board img {
      width: 100%;
      border-radius: 18px;
    }

    .design-board figcaption {
      margin-top: 16px;
      color: var(--white);
      font-size: 0.92rem;
      text-align: center;
    }

    .solution-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .solution {
      overflow: hidden;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .solution-visual {
      min-height: 250px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #0a8b86, #086076);
      padding: 25px;
    }

    .screen-card {
      width: 80%;
      background: var(--white);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 18px 35px rgba(0, 0, 0, 0.18);
    }

    .screen-line {
      height: 11px;
      margin-bottom: 11px;
      background: #d8e4e8;
      border-radius: 10px;
    }

    .screen-line.short {
      width: 65%;
    }

    .screen-button {
      height: 34px;
      margin-top: 20px;
      background: var(--yellow);
      border-radius: 18px;
    }

    .solution-copy {
      padding: 25px;
    }

    .solution-copy h3 {
      margin-bottom: 8px;
      color: var(--heading);
    }

    .solution-copy p {
      color: var(--text);
    }

    .checklist {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      list-style: none;
    }

    .checklist li {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      color: var(--heading);
      font-weight: 700;
      box-shadow: 0 8px 22px rgba(18, 62, 87, 0.07);
    }

    .checklist li::before {
      content: "✓";
      margin-right: 10px;
      color: var(--teal);
      font-weight: 900;
    }

    .outcome-panel {
      background: var(--white);
      border-radius: 28px;
      padding: 40px;
      box-shadow: var(--shadow);
    }

    .outcome-panel h3 {
      margin-bottom: 16px;
      color: var(--heading);
      font-size: 1.8rem;
    }

    .outcome-panel p {
      margin-bottom: 16px;
      color: var(--text);
    }

    .disclaimer {
      margin-top: 30px;
      background: var(--cream);
      border-left: 5px solid #d97706;
      border-radius: 8px;
      padding: 24px;
      color: var(--text);
    }

    .disclaimer strong {
      display: block;
      margin-bottom: 6px;
      color: var(--heading);
    }

    .contact-section {
      background: var(--light-teal);
      text-align: center;
    }

    .contact-section .section-heading {
      margin-right: auto;
      margin-left: auto;
    }

    .contact-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
    }

    .contact-actions .button-primary {
      background: var(--deep-blue);
      color: var(--white);
    }

    .contact-actions .button-secondary {
      border-color: var(--deep-blue);
      color: var(--deep-blue);
    }

    footer {
      background: var(--deep-blue);
      color: var(--white);
      padding: 30px 0;
      text-align: center;
    }

    .back-to-top {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 90;
      display: none;
      width: 48px;
      height: 48px;
      background: var(--yellow);
      color: var(--heading);
      border: 0;
      border-radius: 50%;
      font-size: 1.25rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    .back-to-top.visible {
      display: block;
    }

    a:focus,
    button:focus {
      outline: 4px solid var(--yellow);
        padding: 78px 0 68px;
      }

      section {
        padding: 68px 0;
      }
    }

    @media (max-width: 520px) {
      .project-meta,
      .cards,
      .solution-grid,
      .checklist,
      .flow {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 3.5rem;
      }

      .process-item {
        grid-template-columns: 55px 1fr;
      }

      .persona-card,
      .outcome-panel {
        padding: 25px;
      }

      .button {
        width: 100%;
      }
    }
    <section class="light-section" id="overview">
      <div class="container">
        <div class="section-heading">
          <p class="eyebrow">Project overview</p>

          <h2>A clearer and more trustworthy marketplace experience</h2>

          <p>
            OpenMarket was created as an independent portfolio concept to
            demonstrate product strategy, customer-centred design,
            information architecture, interaction design and accessible
            interface design.
          </p>
        </div>

        <div class="two-column">
          <div class="content-block">
            <h3>The opportunity</h3>

            <p>
              Online shoppers can face overwhelming product choices,
              inconsistent seller information, unclear delivery expectations
              and complicated checkout journeys.
            </p>

            <p>
              This concept explores how a marketplace could reduce these
              difficulties while retaining the range and flexibility
              customers expect from a modern e-commerce platform.
            </p>
          </div>

          <div class="highlight">
            <strong>Design objective</strong>

            <p>
              Create a responsive marketplace that helps customers find
              relevant products, assess seller reliability and complete
              purchases confidently.
            </p>
          </div>
        </div>
      </div>
    </section>

    <section class="alternate-section" id="challenge">
      <div class="container">
        <div class="section-heading">
          <p class="eyebrow">The challenge</p>

          <h2>Removing uncertainty from discovery and checkout</h2>

          <p>
            The experience needed to support quick decisions while remaining
            understandable for customers with different levels of digital
            confidence.
          </p>
        </div>

        <div class="cards">
          <article class="card">
            <p class="card-number">01</p>
            <h3>Complex discovery</h3>

            <p>
              Customers need effective search, familiar categories and
              filters that narrow choices without creating confusion.
            </p>
          </article>

          <article class="card">
            <p class="card-number">02</p>
            <h3>Trust concerns</h3>

            <p>
              Seller ratings, delivery information, returns and payment
              protection must be visible before purchase.
            </p>
          </article>

          <article class="card">
            <p class="card-number">03</p>
            <h3>Checkout friction</h3>

            <p>
              Long forms, unexpected costs and unclear progress can cause
              customers to abandon their baskets.
            </p>
          </article>
        </div>
      </div>
    </section>

    <section class="light-section" id="process">
      <div class="container">
        <div class="section-heading">
          <p class="eyebrow">Design process</p>

          <h2>A structured approach from problem to interface</h2>

          <p>
            The project follows a practical product-design process. As this
            is a concept, its findings and outcomes are presented as design
            hypotheses rather than verified company results.
          </p>
        </div>

        <div class="process">
          <article class="process-item">
            <div>
              <h3>Discover</h3>

              <p>
                Reviewed common marketplace journeys and identified possible
                friction involving product discovery, trust, delivery and
                payment.
              </p>
            </div>
          </article>

          <article class="process-item">
            <div>
              <h3>Define</h3>

              <p>
                Organised the observations into customer needs, business
                opportunities and a focused problem statement.
              </p>
            </div>
          </article>

          <article class="process-item">
            <div>
              <h3>Develop</h3>

              <p>
                Created customer journeys, user flows, information
                architecture, wireframes and reusable interface patterns.
              </p>
            </div>
          </article>

          <article class="process-item">
            <div>
              <h3>Evaluate</h3>

              <p>
                Reviewed the proposed experience against usability,
                responsiveness and accessibility requirements.
              </p>
            </div>
          </article>
        </div>
      </div>
    </section>

    <section class="bright-section" id="user">
    <section class="alternate-section" id="journey">
      <div class="container">
        <div class="section-heading">
          <p class="eyebrow">Core journey</p>

          <h2>A focused route from discovery to confirmation</h2>

          <p>
            The proposed journey reduces unnecessary decisions and keeps
            essential information visible at every stage.
          </p>
        </div>

        <div class="flow" aria-label="OpenMarket customer journey">
          <div class="flow-step">Discover</div>
          <div class="flow-step">Filter</div>
          <div class="flow-step">Evaluate</div>
          <div class="flow-step">Checkout</div>
          <div class="flow-step">Confirm</div>
        </div>
      </div>
    </section>

    <section class="light-section" id="designs">
      <div class="container">
        <div class="section-heading">
          <p class="eyebrow">Interface exploration</p>

          <h2>Mobile-first OpenMarket screens</h2>

          <p>
            The screens demonstrate the visual direction for product
            discovery, categories, product details, the shopping basket and
            checkout.
          </p>
        </div>

        <figure class="design-board">
          <img
            src="openmarket-screens.png"
            alt="OpenMarket mobile interface concepts showing marketplace home, categories, product details, basket and checkout screens"
          >

          <figcaption>
            OpenMarket interface concepts created for this independent
            portfolio case study.
          </figcaption>
        </figure>
      </div>
    </section>

    <section class="alternate-section" id="solution">
      <div class="container">
        <div class="section-heading">
          <p class="eyebrow">Proposed solution</p>

          <h2>Three principles guiding the experience</h2>

          <p>
            The proposed interface prioritises clarity, trust and a
            predictable route through the marketplace.
          </p>
        </div>

        <div class="solution-grid">
          <article class="solution">
            <div class="solution-visual">
              <div class="screen-card">
                <div class="screen-line"></div>
                <div class="screen-line short"></div>
                <div class="screen-line"></div>
                <div class="screen-button"></div>
              </div>
            </div>

            <div class="solution-copy">
              <h3>Focused discovery</h3>

              <p>
                Clear search, categories and filters help customers reduce
                large product selections.
              </p>
            </div>
          </article>

          <article class="solution">
            <div class="solution-visual">
              <div class="screen-card">
                <div class="screen-line short"></div>
                <div class="screen-line"></div>
                <div class="screen-line"></div>
                <div class="screen-button"></div>
              </div>
            </div>

            <div class="solution-copy">
              <h3>Visible trust signals</h3>

              <p>
                Seller details, customer reviews, delivery information and
                returns are placed close to purchasing decisions.
              </p>
            </div>
          </article>

          <article class="solution">
            <div class="solution-visual">
              <div class="screen-card">
                <div class="screen-line"></div>
                <div class="screen-line short"></div>
                <div class="screen-line short"></div>
                <div class="screen-button"></div>
              </div>
            </div>

            <div class="solution-copy">
              <h3>Simplified checkout</h3>

              <p>
                A logical sequence and clear order summary reduce uncertainty
                before payment.
              </p>
            </div>
          </article>
        </div>
      </div>
    </section>

    <section class="light-section" id="accessibility">
      <div class="container">
        <div class="section-heading">
          <p class="eyebrow">Inclusive design</p>

          <h2>Accessibility considered from the beginning</h2>

          <p>
            The proposed experience uses understandable content, clear colour
            contrast, visible focus states and responsive layouts.
          </p>
        </div>

        <ul class="checklist">
          <li>Meaningful headings and page structure</li>
          <li>Keyboard-accessible navigation</li>
          <li>Visible keyboard-focus indicators</li>
          <li>Clear foreground and background contrast</li>
          <li>Descriptive labels and alternative text</li>
          <li>Responsive mobile and desktop layouts</li>
        </ul>
      </div>
    </section>

    <section class="bright-section" id="outcome">
      <div class="container">
        <div class="section-heading">
          <p class="eyebrow">Outcome and reflection</p>

          <h2>A scalable foundation for a marketplace product</h2>

          <p>
            The concept demonstrates an end-to-end senior product-design
            approach.
          </p>
        </div>

        <div class="outcome-panel">
          <h3>What the concept demonstrates</h3>

          <p>
            OpenMarket demonstrates how research assumptions, product
            strategy, information architecture, interaction design and
            accessible visual design can be brought together in a unified

    <section class="contact-section">

        <div class="contact-actions">
      const isOpen = navigationLinks.classList.toggle("open");

      menuButton.setAttribute(
        "aria-expanded",
        isOpen ? "true" : "false"
      );
    });

    document.querySelectorAll(".nav-links a").forEach(function (link) {
      link.addEventListener("click", function () {
        navigationLinks.classList.remove("open");
        menuButton.setAttribute("aria-expanded", "false");
      });
    });

    window.addEventListener("scroll", function () {
      if (window.scrollY > 500) {
        backToTop.classList.add("visible");
      } else {
        backToTop.classList.remove("visible");
      }
    });

    backToTop.addEventListener("click", function () {
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });
